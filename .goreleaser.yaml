version: 2
project_name: vapour
before:
  hooks:
    - go mod tidy
builds:
  - id: vapour
    main: .
    binary: vapour
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/vapour-computer/vapour-cli/cmd.Version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "vapour_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
